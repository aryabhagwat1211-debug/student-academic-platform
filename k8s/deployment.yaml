apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-academic-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-academic
  template:
    metadata:
      labels:
        app: student-academic
    spec:
      containers:
        - name: student-academic-container
          image: student-academic-platform:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5